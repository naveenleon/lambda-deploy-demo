version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
  build:
    commands:
      - sam --version
      - sam build
      - sam deploy
        --stack-name my-lambda-stack
        --capabilities CAPABILITY_IAM
        --resolve-s3
        --region $AWS_REGION
        --no-confirm-changeset
        --no-fail-on-empty-changeset
